<svg xmlns="http://www.w3.org/2000/svg" width="880" height="930" viewBox="0 0 880 930" role="img" aria-label="网络聊天室后端分层架构">
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#A1A1AA"/>
    </marker>
    <style>
      .title { fill: #171717; font: 600 28px "PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
      .subtitle { fill: #71717A; font: 400 15px "PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
      .layer-label { fill: #71717A; font: 500 13px "PingFang SC","Microsoft YaHei",system-ui,sans-serif; letter-spacing: .3px; }
      .node-title { fill: #171717; font: 500 14px "PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
      .node-caption { fill: #71717A; font: 400 12px "PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
      .core-title { fill: #004D26; font: 500 14px "PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
      .core-caption { fill: #04703A; font: 400 12px "PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
      .layer { fill: #F7F7F8; stroke: #D3D4DA; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .node { fill: #FFFFFF; stroke: #D3D4DA; stroke-width: 1.5; }
      .core-layer { fill: #E5FFF2; stroke: #0FDC78; stroke-width: 2; }
      .core-node { fill: #FFFFFF; stroke: #0FDC78; stroke-width: 1.5; }
      .flow { stroke: #A1A1AA; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="880" height="930" fill="#FFFFFF"/>

  <text class="title" x="40" y="52">网络聊天室 · 后端分层架构</text>
  <text class="subtitle" x="40" y="84">C++17 + Crow · HTTP 与 WebSocket 混合 · MySQL 持久化 · 单端口同源托管</text>

  <!-- 浏览器 -->
  <rect class="node" x="260" y="130" width="360" height="64" rx="8"/>
  <text class="node-title" x="440" y="158" text-anchor="middle">浏览器前端</text>
  <text class="node-caption" x="440" y="178" text-anchor="middle">HTML · CSS · JS   ｜   HTTP + WebSocket</text>

  <path class="flow" d="M440 194 L440 232" marker-end="url(#arrow)"/>

  <!-- 接入层 -->
  <rect class="layer" x="40" y="232" width="800" height="120" rx="10"/>
  <text class="layer-label" x="60" y="258">接入层 · include/framework</text>
  <rect class="node" x="230" y="270" width="420" height="64" rx="8"/>
  <text class="node-title" x="440" y="298" text-anchor="middle">Crow 服务器</text>
  <text class="node-caption" x="440" y="318" text-anchor="middle">HTTP 路由 · WebSocket 路由 · 静态文件托管</text>

  <path class="flow" d="M440 352 L440 392" marker-end="url(#arrow)"/>

  <!-- 接口层 -->
  <rect class="layer" x="40" y="392" width="800" height="136" rx="10"/>
  <text class="layer-label" x="60" y="418">接口层 · include/user · include/chat · include/websocket</text>

  <rect class="node" x="64" y="432" width="240" height="70" rx="8"/>
  <text class="node-title" x="184" y="460" text-anchor="middle">鉴权控制器</text>
  <text class="node-caption" x="184" y="480" text-anchor="middle">注册 / 登录 / 登出</text>

  <rect class="node" x="320" y="432" width="240" height="70" rx="8"/>
  <text class="node-title" x="440" y="460" text-anchor="middle">聊天控制器</text>
  <text class="node-caption" x="440" y="480" text-anchor="middle">在线用户 / 私聊窗口</text>

  <rect class="node" x="576" y="432" width="240" height="70" rx="8"/>
  <text class="node-title" x="696" y="460" text-anchor="middle">WS 控制器</text>
  <text class="node-caption" x="696" y="480" text-anchor="middle">连接 / 消息分发</text>

  <path class="flow" d="M440 528 L440 568" marker-end="url(#arrow)"/>

  <!-- 业务层 -->
  <rect class="core-layer" x="40" y="568" width="800" height="146" rx="10"/>
  <text class="layer-label" x="60" y="594" fill="#04703A">业务层（核心）· include/user · include/chat</text>

  <rect class="core-node" x="64" y="606" width="176" height="76" rx="8"/>
  <text class="core-title" x="152" y="634" text-anchor="middle">鉴权服务</text>
  <text class="core-caption" x="152" y="654" text-anchor="middle">会话生命周期</text>

  <rect class="core-node" x="256" y="606" width="176" height="76" rx="8"/>
  <text class="core-title" x="344" y="634" text-anchor="middle">大厅服务</text>
  <text class="core-caption" x="344" y="654" text-anchor="middle">大厅历史边界</text>

  <rect class="core-node" x="448" y="606" width="176" height="76" rx="8"/>
  <text class="core-title" x="536" y="634" text-anchor="middle">私聊服务</text>
  <text class="core-caption" x="536" y="654" text-anchor="middle">窗口与消息</text>

  <rect class="core-node" x="640" y="606" width="176" height="76" rx="8"/>
  <text class="core-title" x="728" y="634" text-anchor="middle">在线用户服务</text>
  <text class="core-caption" x="728" y="654" text-anchor="middle">在线状态</text>

  <path class="flow" d="M440 714 L440 754" marker-end="url(#arrow)"/>

  <!-- 存储层 -->
  <rect class="layer" x="40" y="754" width="800" height="136" rx="10"/>
  <text class="layer-label" x="60" y="780">存储层 · include/storage</text>

  <rect class="node" x="64" y="792" width="368" height="76" rx="8"/>
  <text class="node-title" x="248" y="820" text-anchor="middle">MySQL 持久化</text>
  <text class="node-caption" x="248" y="840" text-anchor="middle">用户 / 大厅消息 / 私聊记录</text>

  <rect class="node" x="448" y="792" width="368" height="76" rx="8"/>
  <text class="node-title" x="632" y="820" text-anchor="middle">进程内存状态</text>
  <text class="node-caption" x="632" y="840" text-anchor="middle">session / 连接 / 私聊窗口</text>
</svg>