<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聊天室</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="chat-container">

        <!-- 顶部标题 -->
        <div class="chat-header">
            <span>长庚的聊天室</span>
            <div class="header-actions">
                <span id="connectionStatus" class="conn-status conn-connecting">连接中…</span>
                <span id="onlineCount" class="online-count"></span>
                <span id="currentNickname"></span>
                <button id="logoutButton" type="button">退出登录</button>
            </div>
        </div>

        <!-- 聊天主体 -->
        <div class="chat-main">

            <!-- 左边用户列表 -->
            <div class="user-list">

                <h3>聊天</h3>

                <!-- 公共大厅 -->
                <div class="user lobby active" data-type="lobby">
                    <span class="user-name">💬 公共大厅</span>
                    <span class="badge" id="lobbyBadge"></span>
                </div>

                <h3>在线用户</h3>

                <!-- 在线用户 -->
                <div id="userList">
                    <!-- 由后端在线列表动态生成 -->
                </div>

            </div>

            <!-- 右边聊天区域 -->
            <div class="chat-area">

                <div class="chat-title" id="chatTitle">
                    请选择一个用户
                </div>

                <div id="chatBox">
                </div>

                <div class="input-area">

                    <textarea
                        id="messageInput"
                        placeholder="请输入消息，Enter 发送，Shift+Enter 换行"
                        rows="1"
                    ></textarea>

                    <button id="sendButton">
                        发送
                    </button>

                </div>

            </div>

        </div>

    </div>

    <script src="js/common.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
