<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>注册</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="login-container">

        <h1>聊天室</h1>

        <h2>注册</h2>

        <input
            id="username"
            type="text"
            placeholder="用户名"
        >

        <input
            id="password"
            type="password"
            placeholder="密码"
        >

        <input
            id="confirmPassword"
            type="password"
            placeholder="确认密码"
        >

        <button id="registerButton">
            注册
        </button>

        <p>
            已经有账号？
            <a href="login.html">登录</a>
        </p>

    </div>

    <script src="js/register.js"></script>
</body>

</html>
