<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>登录</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="login-container">

        <h1>聊天室</h1>

        <h2>登录</h2>

        <input
            id="username"
            type="text"
            placeholder="用户名"
        >

        <input
            id="password"
            type="password"
            placeholder="密码"
        >

        <button id="loginButton">
            登录
        </button>

        <p>
            还没有账号？
            <a href="register.html">注册</a>
        </p>

    </div>

    <script src="js/common.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
